name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@v6.1.0
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install
        run: pnpm install
      - name: Lint (oxlint)
        run: pnpm lint
      - name: Format check (oxfmt)
        run: pnpm format:check
