name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@v6.1.0
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format, lint, and type checks (Vite+ and Astro)
        run: pnpm check
      - name: Tests (Vitest)
        run: pnpm test
      - name: Build (Astro and Rolldown)
        run: pnpm build
